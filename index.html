<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語穴埋めクイズ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 640px;
      padding: 36px 32px;
    }

    /* ===== START SCREEN ===== */
    #start-screen { text-align: center; }
    .app-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 8px;
    }
    .app-subtitle {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 36px;
    }
    .level-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .level-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-align: left;
    }
    .level-btn:hover { border-color: #a5b4fc; background: #eef2ff; transform: translateY(-2px); }
    .level-btn .level-icon { font-size: 2rem; }
    .level-btn .level-info { display: flex; flex-direction: column; }
    .level-btn .level-name { font-size: 1.05rem; font-weight: 700; color: #1f2937; }
    .level-btn .level-desc { font-size: 0.83rem; color: #6b7280; margin-top: 2px; }
    .level-btn[data-level="beginner"]     { border-color: #86efac; }
    .level-btn[data-level="beginner"]:hover  { background: #f0fdf4; border-color: #22c55e; }
    .level-btn[data-level="intermediate"] { border-color: #93c5fd; }
    .level-btn[data-level="intermediate"]:hover { background: #eff6ff; border-color: #3b82f6; }
    .level-btn[data-level="advanced"]     { border-color: #f9a8d4; }
    .level-btn[data-level="advanced"]:hover  { background: #fdf2f8; border-color: #ec4899; }

    /* ===== QUIZ SCREEN ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header-left { display: flex; flex-direction: column; gap: 2px; }
    .quiz-mode-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .quiz-mode-label.normal   { background: #eef2ff; color: #4f46e5; }
    .quiz-mode-label.review   { background: #fff7ed; color: #ea580c; }
    .quiz-title { font-size: 1rem; color: #6b7280; font-weight: 600; }

    .score-badge {
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 4px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .progress-wrap {
      background: #e5e7eb;
      border-radius: 8px;
      height: 6px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-bar { height: 100%; border-radius: 8px; transition: width 0.4s ease; }
    .progress-bar.normal { background: #4f46e5; }
    .progress-bar.review { background: #ea580c; }

    .question-count { font-size: 0.82rem; color: #9ca3af; margin-bottom: 10px; }

    .sentence {
      font-size: 1.3rem;
      line-height: 1.75;
      color: #1f2937;
      margin-bottom: 26px;
      font-weight: 500;
      word-break: break-word;
    }
    .blank {
      display: inline-block;
      border-bottom: 3px solid #4f46e5;
      min-width: 80px;
      text-align: center;
      color: #4f46e5;
      font-weight: 700;
      padding: 0 6px;
      transition: color 0.2s, border-color 0.2s;
    }
    .blank.correct { color: #16a34a; border-color: #16a34a; }
    .blank.wrong   { color: #dc2626; border-color: #dc2626; }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .choice-btn {
      padding: 13px 10px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      font-weight: 500;
      color: #374151;
    }
    .choice-btn:hover:not(:disabled) { border-color: #a5b4fc; background: #eef2ff; transform: translateY(-2px); }
    .choice-btn:disabled { cursor: default; transform: none; }
    .choice-btn.correct { border-color: #16a34a; background: #dcfce7; color: #15803d; }
    .choice-btn.wrong   { border-color: #dc2626; background: #fee2e2; color: #b91c1c; }
    .choice-btn.reveal  { border-color: #16a34a; background: #dcfce7; color: #15803d; }

    .feedback {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 18px;
      display: none;
    }
    .feedback.correct { display: block; background: #dcfce7; color: #15803d; }
    .feedback.wrong   { display: block; background: #fee2e2; color: #b91c1c; }

    .next-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background 0.2s;
      color: #fff;
    }
    .next-btn.normal { background: #4f46e5; }
    .next-btn.normal:hover { background: #4338ca; }
    .next-btn.review { background: #ea580c; }
    .next-btn.review:hover { background: #c2410c; }

    /* ===== RESULT SCREEN ===== */
    #result-screen { display: none; text-align: center; }
    .result-emoji { font-size: 4rem; margin-bottom: 12px; }
    .result-title { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 6px; }
    .result-score { font-size: 3rem; font-weight: 800; color: #4f46e5; margin: 14px 0 4px; }
    .result-label { font-size: 0.9rem; color: #6b7280; margin-bottom: 28px; }
    .result-actions { display: flex; flex-direction: column; gap: 10px; }
    .review-btn {
      padding: 14px;
      background: #fff7ed;
      color: #ea580c;
      border: 2px solid #ea580c;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .review-btn:hover { background: #ffedd5; }
    .restart-btn {
      padding: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .restart-btn:hover { background: #4338ca; }
    .back-btn {
      padding: 12px;
      background: #fff;
      color: #6b7280;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #f9fafb; }

    /* ===== REVIEW COMPLETE ===== */
    #review-complete-screen { display: none; text-align: center; }

    @media (max-width: 480px) {
      .card { padding: 24px 16px; }
      .sentence { font-size: 1.1rem; }
      .choices { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 難易度選択 -->
    <div id="start-screen">
      <div class="app-title">英語穴埋めクイズ</div>
      <div class="app-subtitle">難易度を選んでスタート</div>
      <div class="level-label">難易度を選択</div>
      <div class="level-buttons">
        <button class="level-btn" data-level="beginner">
          <span class="level-icon">🌱</span>
          <span class="level-info">
            <span class="level-name">初級</span>
            <span class="level-desc">基本文法・日常表現（中学〜高校レベル）</span>
          </span>
        </button>
        <button class="level-btn" data-level="intermediate">
          <span class="level-icon">📘</span>
          <span class="level-info">
            <span class="level-name">中級</span>
            <span class="level-desc">時制・語彙・慣用句（大学・TOEIC 600点台）</span>
          </span>
        </button>
        <button class="level-btn" data-level="advanced">
          <span class="level-icon">🔥</span>
          <span class="level-info">
            <span class="level-name">上級</span>
            <span class="level-desc">高度な文法・難語彙（TOEIC 800点以上・英検準1級）</span>
          </span>
        </button>
      </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" style="display:none;">
      <div class="header">
        <div class="header-left">
          <span class="quiz-mode-label normal" id="mode-label">通常モード</span>
          <span class="quiz-title" id="quiz-title"></span>
        </div>
        <div class="score-badge">スコア: <span id="score-display">0</span></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar normal" id="progress-bar"></div>
      </div>
      <div class="question-count" id="question-count"></div>
      <div class="sentence" id="sentence"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn normal" id="next-btn">次の問題へ →</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-label" id="result-label"></div>
      <div class="result-actions">
        <button class="review-btn" id="review-btn" style="display:none;">
          📝 間違えた問題を復習する（<span id="wrong-count"></span>問）
        </button>
        <button class="restart-btn" id="restart-btn">もう一度同じ難易度で</button>
        <button class="back-btn" id="back-btn">難易度選択に戻る</button>
      </div>
    </div>

    <!-- 復習完了画面 -->
    <div id="review-complete-screen">
      <div class="result-emoji">✅</div>
      <div class="result-title">復習完了！</div>
      <div style="color:#6b7280; margin: 16px 0 32px; font-size:0.95rem;">
        復習した問題の<strong id="review-score-label"></strong>
      </div>
      <div class="result-actions">
        <button class="restart-btn" id="review-restart-btn">同じ難易度でもう一度</button>
        <button class="back-btn" id="review-back-btn">難易度選択に戻る</button>
      </div>
    </div>

  </div>

  <script>
    // ===== 状態 =====
    let allQuestions = [];    // 現在の難易度の全問題
    let queue = [];           // 出題順インデックス
    let current = 0;
    let score = 0;
    let wrongIndices = [];    // 間違えた問題の allQuestions インデックス
    let answered = false;
    let currentLevel = '';
    let isReviewMode = false;

    // ===== ユーティリティ =====
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(id) {
      ['start-screen', 'quiz-screen', 'result-screen', 'review-complete-screen'].forEach(s => {
        document.getElementById(s).style.display = s === id ? 'block' : 'none';
      });
    }

    // ===== 難易度選択 =====
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const level = btn.dataset.level;
        await startQuiz(level, false);
      });
    });

    async function startQuiz(level, reviewMode) {
      if (!reviewMode) {
        const res = await fetch(`questions/${level}.json`);
        allQuestions = await res.json();
        currentLevel = level;
      }

      isReviewMode = reviewMode;
      const levelNames = { beginner: '初級', intermediate: '中級', advanced: '上級' };

      if (reviewMode) {
        queue = shuffle(wrongIndices);
      } else {
        queue = shuffle(allQuestions.map((_, i) => i));
        wrongIndices = [];
      }

      current = 0;
      score = 0;
      answered = false;

      // UI 切り替え
      const modeLabel = document.getElementById('mode-label');
      const progressBar = document.getElementById('progress-bar');
      const nextBtn = document.getElementById('next-btn');

      if (reviewMode) {
        modeLabel.textContent = '復習モード';
        modeLabel.className = 'quiz-mode-label review';
        progressBar.className = 'progress-bar review';
        nextBtn.className = 'next-btn review';
      } else {
        modeLabel.textContent = '通常モード';
        modeLabel.className = 'quiz-mode-label normal';
        progressBar.className = 'progress-bar normal';
        nextBtn.className = 'next-btn normal';
      }

      document.getElementById('quiz-title').textContent = `${levelNames[level]} ${reviewMode ? '/ 復習' : ''}`;

      showScreen('quiz-screen');
      showQuestion();
    }

    // ===== 問題表示 =====
    function showQuestion() {
      answered = false;
      const q = allQuestions[queue[current]];
      const total = queue.length;

      document.getElementById('score-display').textContent = score;
      document.getElementById('question-count').textContent = `問題 ${current + 1} / ${total}`;
      document.getElementById('progress-bar').style.width = `${(current / total) * 100}%`;
      document.getElementById('sentence').innerHTML = q.sentence.replace('___', '<span class="blank" id="blank">___</span>');

      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback';
      feedback.textContent = '';
      document.getElementById('next-btn').style.display = 'none';

      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      shuffle(q.choices).forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice;
        btn.addEventListener('click', () => selectAnswer(choice, q));
        choicesEl.appendChild(btn);
      });
    }

    // ===== 回答処理 =====
    function selectAnswer(choice, q) {
      if (answered) return;
      answered = true;

      const isCorrect = choice === q.answer;
      if (isCorrect) {
        score++;
      } else {
        if (!isReviewMode) wrongIndices.push(queue[current]);
      }

      document.getElementById('score-display').textContent = score;

      const blank = document.getElementById('blank');
      blank.textContent = q.answer;
      blank.classList.add(isCorrect ? 'correct' : 'wrong');

      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.answer) btn.classList.add(isCorrect ? 'correct' : 'reveal');
        else if (btn.textContent === choice && !isCorrect) btn.classList.add('wrong');
      });

      const feedback = document.getElementById('feedback');
      feedback.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
      feedback.textContent = isCorrect
        ? `✓ 正解！　${q.explanation}`
        : `✗ 不正解。正解は「${q.answer}」　${q.explanation}`;

      document.getElementById('next-btn').style.display = 'block';
    }

    // ===== 次へ =====
    document.getElementById('next-btn').addEventListener('click', () => {
      current++;
      if (current >= queue.length) {
        isReviewMode ? showReviewComplete() : showResult();
      } else {
        showQuestion();
      }
    });

    // ===== 結果画面 =====
    function showResult() {
      document.getElementById('progress-bar').style.width = '100%';
      showScreen('result-screen');

      const total = queue.length;
      const pct = Math.round((score / total) * 100);

      let emoji, title;
      if (pct === 100)    { emoji = '🏆'; title = '満点！パーフェクト！'; }
      else if (pct >= 80) { emoji = '🎉'; title = '素晴らしい！'; }
      else if (pct >= 60) { emoji = '👍'; title = 'よくできました！'; }
      else if (pct >= 40) { emoji = '📚'; title = 'もう少し頑張ろう！'; }
      else                { emoji = '💪'; title = '復習してみよう！'; }

      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-score').textContent = `${score} / ${total}`;
      document.getElementById('result-label').textContent = `正答率 ${pct}%`;

      const reviewBtn = document.getElementById('review-btn');
      if (wrongIndices.length > 0) {
        document.getElementById('wrong-count').textContent = wrongIndices.length;
        reviewBtn.style.display = 'block';
      } else {
        reviewBtn.style.display = 'none';
      }
    }

    // ===== 復習完了画面 =====
    function showReviewComplete() {
      document.getElementById('progress-bar').style.width = '100%';
      const total = queue.length;
      const pct = Math.round((score / total) * 100);
      document.getElementById('review-score-label').textContent = `${score} / ${total} 問正解（${pct}%）`;
      showScreen('review-complete-screen');
    }

    // ===== ボタンイベント =====
    document.getElementById('review-btn').addEventListener('click', () => {
      startQuiz(currentLevel, true);
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
      startQuiz(currentLevel, false);
    });
    document.getElementById('back-btn').addEventListener('click', () => {
      showScreen('start-screen');
    });
    document.getElementById('review-restart-btn').addEventListener('click', () => {
      startQuiz(currentLevel, false);
    });
    document.getElementById('review-back-btn').addEventListener('click', () => {
      showScreen('start-screen');
    });
  </script>
</body>
</html>
